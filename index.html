<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja strona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Moja strona</h1>
    <nav>
      <button class="tab-link active" data-tab="o-mnie">O mnie</button>
      <button class="tab-link" data-tab="portfolio">Portfolio</button>
      <button class="tab-link" data-tab="kontakt">Kontakt</button>
    </nav>
  </header>

  <main>
    <section id="o-mnie" class="tab-content active">
      <h2>O mnie</h2>
      <p>Cześć! Nazywam się [Twoje imię]. Tutaj możesz napisać kilka słów o sobie,
         swoich zainteresowaniach i doświadczeniu.</p>
    </section>

    <section id="portfolio" class="tab-content">
      <h2>Portfolio</h2>
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <h3>Projekt 1</h3>
          <p>Krótki opis projektu.</p>
        </div>
        <div class="portfolio-item">
          <h3>Projekt 2</h3>
          <p>Krótki opis projektu.</p>
        </div>
        <div class="portfolio-item">
          <h3>Projekt 3</h3>
          <p>Krótki opis projektu.</p>
        </div>
      </div>
    </section>

    <section id="kontakt" class="tab-content">
      <h2>Kontakt</h2>
      <form>
        <label for="name">Imię i nazwisko</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Wiadomość</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Wyślij</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Moja strona</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
